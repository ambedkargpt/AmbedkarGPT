# ─────────────────────────────────────────────────────────────────────────────
# Deploy Radio
#
# Builds the Bhim Radio bulletin image and registers its Batch job definition.
# The job (backend/worker/radio_live) rebuilds the bulletin whenever the last
# two days' stories change, newest story first; the schedule
# ambedkargpt-radio-general starts it every few minutes.
#
# Separate from deploy-worker.yml because it is a separate image, and it is a
# separate image because bheem-radio needs openai>=3.0 and google-genai>=2.25
# where this project pins 1.61.1 and 1.29.0. See Dockerfile.radio.
#
# It also runs on its own trigger: the radio changes rarely, and rebuilding a
# 16 GB ML image every time a prompt moves is not worth the minutes.
#
# One-time setup this workflow does not do (see docs/bheem-radio.md):
#   - the ECR repository ambedkargpt-radio
#   - the SARVAM_API_KEY parameter in SSM
#   - the EventBridge schedule ambedkargpt-radio-general (enable it once the
#     first image is pushed; a schedule with no image behind it just fails)
#   - the CloudFront distribution - see backend/deploy/radio-cloudfront-setup.sh
#   - write access to ambedkargpt-radio on ambedkargpt-worker-role
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Radio

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.radio'
      - 'backend/worker/build_radio.py'
      - 'backend/worker/radio_live/**'
      - 'backend/worker/radio_prompts/**'
      - 'backend/worker/radio_assets/**'
      - '.github/workflows/deploy-radio.yml'
  workflow_dispatch:        # for moving the pinned Bheem Radio commit

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build → ECR → Batch Job Def
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The engine repository is private. Its token reaches the build as a
      # BuildKit secret, used for the clone and never stored in the image.
      - name: Build radio image
        env:
          DOCKER_BUILDKIT: "1"
          BHEEM_RADIO_TOKEN: ${{ secrets.BHEEM_RADIO_TOKEN }}
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/ambedkargpt-radio"
          docker build -f Dockerfile.radio \
            --secret id=bheem_radio_token,env=BHEEM_RADIO_TOKEN \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${{ github.sha }}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Push to ECR
        run: |
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${{ github.sha }}"

      # 1 vCPU / 2 GB: mixing an hour of mono audio is light. The slow case is
      # waiting on the voice API, not the mixing, so more CPU buys nothing.
      #
      # Timeout 90 min: the first build voices every line of an hour-long
      # bulletin; later ones find almost everything in the voice cache kept in
      # the bucket and take a few minutes. Most runs find nothing new and exit
      # in under a minute.
      #
      # No retry: the schedule starts the job again in a few minutes anyway,
      # and the build resumes from what the failed run already wrote.
      #
      # SARVAM_API_KEY is listed with the rest because build_radio only reaches
      # for Bulbul v3 when it sees that key, and falls back to a Gemini stock
      # voice when it does not. Leaving it out does not fail the build - it
      # quietly ships the wrong voice, with one warning line nobody reads. The
      # SSM parameter must exist before this runs, or the job cannot start.
      - name: Register Batch job definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          WORKER_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/ambedkargpt-worker-role"
          LOG_GROUP="/aws/batch/job"
          SSM="arn:aws:ssm:ap-south-1:${ACCOUNT_ID}:parameter/ambedkargpt/prod"

          NEW_JOB_DEF_ARN=$(aws batch register-job-definition \
            --job-definition-name ambedkargpt-radio \
            --type container \
            --platform-capabilities FARGATE \
            --retry-strategy '{"attempts": 1}' \
            --timeout '{"attemptDurationSeconds": 5400}' \
            --container-properties "{
              \"image\": \"${IMAGE_URI}:${{ github.sha }}\",
              \"jobRoleArn\":       \"${WORKER_ROLE_ARN}\",
              \"executionRoleArn\": \"${WORKER_ROLE_ARN}\",
              \"fargatePlatformConfiguration\": {\"platformVersion\": \"LATEST\"},
              \"resourceRequirements\": [
                {\"type\": \"VCPU\",   \"value\": \"1\"},
                {\"type\": \"MEMORY\", \"value\": \"2048\"}
              ],
              \"environment\": [
                {\"name\": \"S3_BUCKET\",                   \"value\": \"ambedkargpt-radio\"},
                {\"name\": \"BHEEM_DAILY_PUBLIC_BASE_URL\", \"value\": \"https://d12duaxzxz067j.cloudfront.net\"},
                {\"name\": \"MONGODB_DATABASE\",            \"value\": \"ambedkargpt\"}
              ],
              \"secrets\": [
                {\"name\": \"MONGODB_URI\",      \"valueFrom\": \"${SSM}/MONGODB_URI\"},
                {\"name\": \"DEEPSEEK_API_KEY\", \"valueFrom\": \"${SSM}/DEEPSEEK_API_KEY\"},
                {\"name\": \"GEMINI_API_KEY\",   \"valueFrom\": \"${SSM}/GEMINI_API_KEY\"},
                {\"name\": \"SARVAM_API_KEY\",   \"valueFrom\": \"${SSM}/SARVAM_API_KEY\"}
              ],
              \"networkConfiguration\": {
                \"assignPublicIp\": \"ENABLED\"
              },
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\":  \"${LOG_GROUP}\",
                  \"awslogs-region\": \"ap-south-1\",
                  \"awslogs-stream-prefix\": \"ambedkargpt-radio\"
                }
              }
            }" \
            --query 'jobDefinitionArn' \
            --output text)

          echo "Registered job definition: ${NEW_JOB_DEF_ARN}"
          echo "NEW_JOB_DEF_ARN=${NEW_JOB_DEF_ARN}" >> $GITHUB_ENV

      - name: Deployment summary
        run: |
          echo "## Radio Deployment ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${IMAGE_URI}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Job Definition | \`${NEW_JOB_DEF_ARN}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
