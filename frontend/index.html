    <!--
      Painted before any JavaScript runs. The shell is otherwise an empty div,
      so the whole boot showed a dead navy screen: on a slow connection that
      lasted about seventeen seconds on mobile Safari and read as a broken
      site rather than a loading one. #boot is removed by main.jsx once React
      has mounted.
    -->
    <style>
      html, body { margin: 0; padding: 0; background-color: #05081a; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05081a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot-mark {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      #boot-mark span { color: #8FA8FF; }
      #boot-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(63, 159, 255, 0.16);
      }
      #boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #0a7dff, #3a9fff);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      /* A moving bar is the wrong signal when motion is unwelcome; hold it
         steady and let the wordmark carry the state. */
      @media (prefers-reduced-motion: reduce) {
        #boot-bar::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading AmbedkarGPT">

0)"/><line x1="50" y1="30.5" x2="50" y2="12" transform="rotate(330 50 40)"/><line x1="50" y1="30.5" x2="50" y2="12" transform="rotate(345 50 40)"/></g><circle cx="50" cy="40" r="30" fill="none" stroke="#8FA8FF" stroke-width="6"/></g><circle cx="50" cy="40" r="6" fill="#8FA8FF"/><path d="M33 56 H67 L50 98 Z M46 63 A4 4 0 1 0 54 63 A4 4 0 1 0 46 63 Z M48.6 68 H51.4 V88 H48.6 Z" fill="#8FA8FF" fill-rule="evenodd"/></svg>
